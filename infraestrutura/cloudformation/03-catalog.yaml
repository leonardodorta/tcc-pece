  GoldQualityTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: gold_quality
        Description: "As métricas do próprio pipeline, por execução: cobertura por camada e por campo, com intervalo de Wilson. É o que torna a degradação visível sem ninguém ir olhar."
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          "parquet.compression": SNAPPY
        StorageDescriptor:
          Location: !Sub "s3://${DataLakeBucketName}/gold/quality/"
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - Name: metric_name
              Type: string
              Comment: "o que foi medido"
            - Name: stratum
              Type: string
              Comment: "o estrato em que foi medido; 'agregado' é o corpus todo. Valores: agregado, com_rotulo, sem_rotulo, residuo"
            - Name: numerator
              Type: bigint
              Comment: "quantos satisfizeram"
            - Name: denominator
              Type: bigint
              Comment: "de quantos"
            - Name: proportion
              Type: double
              Comment: "numerador sobre denominador"
            - Name: ci_lower
              Type: double
              Comment: "limite inferior do intervalo de 95%"
            - Name: ci_upper
              Type: double
              Comment: "limite superior"
            - Name: ci_method
              Type: string
              Comment: "método do intervalo; Wilson e não normal, porque com proporção perto de 0 ou 1 o normal produz limite fora de [0,1]. Valores: wilson, bootstrap, katz"
            - Name: measured_at
              Type: timestamp
              Comment: "instante UTC da medição"
            - Name: rule_version
              Type: string
              Comment: "versão do pacote domsp que produziu a linha; muda quando a regra muda"
            - Name: model_version
              Type: string
              Comment: "versão do modelo que participou da linha, ou 'nenhum' quando nenhum participou"
            - Name: run_id
              Type: string
              Comment: "identificador da execução da máquina de estados que produziu a linha"
            - Name: source_hash
              Type: string
              Comment: "SHA-256 do HTML de origem; muda se a fonte republicar conteúdo diferente"
            - Name: processed_at
              Type: timestamp
              Comment: "instante UTC em que a linha foi gravada"

